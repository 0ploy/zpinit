name: ci

# A branch with an open PR used to get two runs per push (push +
# pull_request events, different concurrency keys). Pushes now trigger
# only on main and release tags; everything else runs as a PR check.
#
# The weekly schedule exists for govulncheck (make vuln in the lint
# job): a CVE published between pushes would otherwise go unnoticed
# until someone pushes. It runs the whole workflow on main, which also
# catches runner-image drift. GitHub suspends the schedule after 60
# days without a commit; re-enable it under Actions if that happens.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '0 5 * * 1' # Mondays, 06:00 Berlin (winter)

permissions:
  contents: read

# A new push to the same branch supersedes the running build; main is
# never cancelled so its history stays complete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Every job runs the same Makefile target a developer runs locally,
  # so "green on my machine, red in CI" has one fewer cause.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned to commit SHAs (not tags) so a compromised
      # upstream cannot inject code into our pipeline. Bump deliberately
      # when upgrading; record the human-readable version in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: make lint
      - run: make vuln

  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need tags for `git describe` in `make build`
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      # -race catches the data-race class the v0.3.1 review surfaced and
      # the cgroup/reload/watcher fan-out keeps inviting; -shuffle
      # catches tests that only pass in file order. The suite runs in
      # <15s, so both are cheap insurance.
      - run: make test-race
      - name: make build (verify ldflags apply)
        # Catches the class of bug where the -X path stops matching the
        # var path in cmd/*/main.go: the linker silently ignores the
        # flag and `version` stays "dev", producing a release whose
        # binaries report no version.
        run: |
          make build
          for BIN in bin/zpinit bin/zpctl; do
            VER=$(${BIN} -version)
            echo "${BIN} reports: ${VER}"
            if [ "${VER}" = "dev" ]; then
              echo "::error::Makefile ldflags not applied to ${BIN}; check -X main.version path"
              exit 1
            fi
          done

  integration:
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Includes the docker-gated real-PID-1 test (test/integration/
      # pid1_test.go); the ubuntu runner has a docker daemon, so it runs
      # here rather than skipping as it does on a docker-less dev box.
      - run: make integration-race

  # Merged unit + integration coverage, as an artifact for the humans
  # and a summary in the job log. Not a gate: a threshold would only
  # invite padding tests; the number is for trend-watching.
  coverage:
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make coverage
      - name: coverage summary
        run: |
          {
            echo '### Coverage (unit + integration, merged)'
            echo
            echo '```'
            go tool covdata percent -i=cover/data
            go tool cover -func=cover/coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            cover/coverage.out
            cover/coverage.html
          retention-days: 14
