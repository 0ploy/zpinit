name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # All actions pinned to commit SHAs (not tags) so a compromised
      # upstream cannot inject code into our release pipeline. Bump
      # deliberately when upgrading; record the human-readable version
      # in the trailing comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Newest 1.26.x patch, not whatever the runner has cached:
          # release binaries embed the standard library and its fixes.
          check-latest: true

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Build binaries
        run: |
          VERSION=${GITHUB_REF_NAME}
          LDFLAGS="-s -w -X main.version=${VERSION}"

          for ARCH in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=${ARCH} \
              go build -trimpath -ldflags "${LDFLAGS}" -o zpinit-linux-${ARCH} ./cmd/zpinit
            CGO_ENABLED=0 GOOS=linux GOARCH=${ARCH} \
              go build -trimpath -ldflags "${LDFLAGS}" -o zpctl-linux-${ARCH} ./cmd/zpctl
          done

      - name: Generate checksums
        run: |
          sha256sum \
            zpinit-linux-amd64 zpinit-linux-arm64 \
            zpctl-linux-amd64 zpctl-linux-arm64 \
            > checksums.txt
          cat checksums.txt

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/0ploy/zpinit
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - name: Build release body
        run: |
          # Image tags follow the semver convention (no `v` prefix:
          # `0.1.0`, not `v0.1.0`). Strip the leading `v` from the git
          # tag for image references; keep the raw tag for git refs.
          IMAGE_TAG="${GITHUB_REF_NAME#v}"

          cat > release-body.md << 'HEADER'
          ## Use in your Dockerfile

          ```dockerfile
          COPY --from=ghcr.io/0ploy/zpinit:latest /usr/local/bin/zpinit /usr/local/bin/zpctl /usr/local/bin/
          ```

          Pin to this exact release with `ghcr.io/0ploy/zpinit:IMAGE_TAG_PLACEHOLDER`.

          ## Try it standalone

          ```bash
          docker run --rm -it ghcr.io/0ploy/zpinit:IMAGE_TAG_PLACEHOLDER sh
          # then: zpinit --version, zpinit --check-config /etc/zpinit, zpctl help
          ```

          ## Manual binary download

          Linux only. Pick the binary for your architecture below and verify against `checksums.txt`.

          HEADER

          sed -i "s/IMAGE_TAG_PLACEHOLDER/${IMAGE_TAG}/g" release-body.md

          # Append the latest CHANGELOG section (skips the version heading
          # itself; that already appears as the GitHub release title).
          if [ -f CHANGELOG.md ]; then
            echo "---" >> release-body.md
            echo "" >> release-body.md
            awk '/^## /{if(found) exit; found=1; next} found{print}' CHANGELOG.md >> release-body.md
          fi

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-body.md
          files: |
            zpinit-linux-amd64
            zpinit-linux-arm64
            zpctl-linux-amd64
            zpctl-linux-arm64
            checksums.txt
